<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
<defs>
<linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a57"/><stop offset=".45" stop-color="#e02a1d"/><stop offset="1" stop-color="#7d0c08"/></linearGradient>
<linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa7d9"/><stop offset=".4" stop-color="#1d5fa8"/><stop offset="1" stop-color="#0a2f5c"/></linearGradient>
<linearGradient id="ch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#aab2bc"/><stop offset="1" stop-color="#5d646e"/></linearGradient>
<radialGradient id="vol" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff7a66"/><stop offset=".6" stop-color="#d8231a"/><stop offset="1" stop-color="#7d0c08"/></radialGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
