<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460">
<defs>
<linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a57"/><stop offset=".45" stop-color="#e02a1d"/><stop offset="1" stop-color="#7d0c08"/></linearGradient>
<linearGradient id="pipeV" x1="0" x2="1"><stop offset="0" stop-color="#7d0c08"/><stop offset=".35" stop-color="#ff6a57"/><stop offset=".6" stop-color="#e02a1d"/><stop offset="1" stop-color="#7d0c08"/></linearGradient>
<linearGradient id="shirt" x1="0" x2="1"><stop offset="0" stop-color="#ff5a47"/><stop offset=".6" stop-color="#d8231a"/><stop offset="1" stop-color="#a4140d"/></linearGradient>
<linearGradient id="pant" x1="0" x2="1"><stop offset="0" stop-color="#1d4f8f"/><stop offset="1" stop-color="#0a2547"/></linearGradient>
<linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#c98a5e"/><stop offset=".5" stop-color="#b0724a"/><stop offset="1" stop-color="#8a5634"/></linearGradient>
<radialGradient id="hat" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffc21a"/><stop offset="1" stop-color="#c98a00"/></radialGradient>
<linearGradient id="ch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#aab2bc"/><stop offset="1" stop-color="#5d646e"/></linearGradient>
<linearGradient id="br" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe39a"/><stop offset=".5" stop-color="#d9a52c"/><stop offset="1" stop-color="#7a540c"/></linearGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="200" cy="446" rx="170" ry="12" fill="url(#sh)"/>
<!-- riser pipe -->
<rect x="306" y="20" width="44" height="420" fill="url(#pipeV)"/>
<rect x="296" y="60" width="64" height="14" rx="3" fill="url(#ch)"/>
<rect x="296" y="380" width="64" height="14" rx="3" fill="url(#ch)"/>
<!-- branch + landing valve -->
<rect x="232" y="150" width="80" height="36" fill="url(#pipe)"/>
<rect x="226" y="142" width="14" height="52" rx="3" fill="url(#ch)"/>
<ellipse cx="214" cy="168" rx="24" ry="30" fill="url(#br)"/>
<rect x="206" y="104" width="16" height="44" fill="url(#br)"/>
<ellipse cx="214" cy="102" rx="34" ry="9" fill="#8f0f0b"/><ellipse cx="214" cy="99" rx="34" ry="9" fill="url(#pipe)"/>
<!-- legs -->
<path d="M96 300h40l6 132h-34z" fill="url(#pant)"/>
<path d="M140 300h40l-4 132h-34z" fill="url(#pant)"/>
<path d="M104 426h40l4 16H96z" fill="#2a2f36"/><path d="M142 426h40l6 16h-46z" fill="#2a2f36"/>
<!-- torso -->
<path d="M88 182c0-20 16-32 36-32h44c20 0 36 12 36 32l-6 124H96z" fill="url(#shirt)"/>
<path d="M134 150l12 26 12-26z" fill="#a4140d"/>
<rect x="96" y="290" width="108" height="16" rx="3" fill="#1b1f25"/>
<text x="126" y="214" font-family="Arial" font-size="11" font-weight="800" fill="#fff">THE FIRE</text>
<text x="126" y="227" font-family="Arial" font-size="11" font-weight="800" fill="#fff">WALA</text>
<path d="M114 206c-6 6-6 14 0 20 2-6 8-8 6-16z" fill="#ffb27d"/>
<!-- back arm -->
<path d="M96 186c-18 30-24 70-12 104l20-4c-6-30-2-60 10-86z" fill="url(#shirt)"/>
<circle cx="94" cy="292" r="12" fill="url(#skin)"/>
<!-- front arm raised to valve with wrench -->
<path d="M196 176c20 4 30 0 40-10l14 16c-14 16-34 22-58 16z" fill="url(#shirt)"/>
<path d="M236 166l16-26 16 8-12 30z" fill="url(#skin)"/>
<!-- wrench -->
<g transform="rotate(-38 258 146)"><rect x="196" y="140" width="78" height="12" rx="4" fill="url(#ch)"/><path d="M272 132h22v12h-10v4h10v12h-22z" fill="url(#ch)"/></g>
<!-- neck + head -->
<rect x="134" y="128" width="26" height="26" fill="url(#skin)"/>
<ellipse cx="147" cy="104" rx="30" ry="34" fill="url(#skin)"/>
<ellipse cx="160" cy="98" rx="3" ry="4" fill="#2a1a10"/>
<path d="M150 116q8 4 14 0" stroke="#6e3f22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<!-- helmet -->
<path d="M112 92c0-30 18-46 38-46s38 16 38 46z" fill="url(#hat)"/>
<rect x="104" y="88" width="94" height="10" rx="5" fill="#d99a00"/>
<path d="M146 48v42" stroke="#e0a800" stroke-width="6"/>
<path d="M124 70a30 30 0 0 1 18-18" stroke="#fff" stroke-width="5" fill="none" opacity=".7" stroke-linecap="round"/>
<!-- water drops / sparkle -->
<g fill="#00A0B0" opacity=".8"><circle cx="248" cy="200" r="4"/><circle cx="258" cy="214" r="3"/></g>
</svg>
